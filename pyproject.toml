[project]
description = "A starter template for marimo notebooks with uv and JAX"
name = "marimo-uv-jax"
requires-python = ">=3.14"
version = "0.1.0"
dependencies = [
  # Visualization
  "marimo>=0.18.4",
  "altair>=5.5.0",
  "polars>=1.17.1",
  "treescope>=0.1.9",
  ## Core scientific computing.
  # Modern JAX (>=0.7.2, the first release with CUDA 13 wheels); jaxlib is
  # pulled transitively. Intel (x86_64) macOS is not supported.
  "jax>=0.7.2",
  ## Frameworks for scientific computing.
  "equinox>=0.12.2",
  "jaxtyping>=0.3.2",
  "optax>=0.2.4",
  "optimistix>=0.0.10",
]

[project.optional-dependencies]
# NVIDIA GPU on Linux: `uv sync --extra cuda`. Adds the CUDA 13 jaxlib plugin on
# top of the modern CPU jax above; no-op on macOS / non-Linux.
cuda = [
  "jax[cuda13]>=0.7.2 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_uv_jax"]

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "ipython>=8.31.0",
  "prek>=0.2.22",
  "ruff>=0.12.2",  # keep in step with the ruff-pre-commit hook pin
  "ty>=0.0.1a10",
]
test = [
  "beartype>=0.19.0",
  "hypothesis>=6.148.7",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-xdist>=3.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["tests"]
# Coverage and xdist each spin up a fresh JAX backend per worker and regenerate
# htmlcov/ on every run. They are opt-in:
#   uv run pytest --cov=marimo_uv_jax --cov-report=term-missing -n=auto

[tool.coverage.run]
source = ["marimo_uv_jax"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*",
]

[tool.coverage.report]
# No fail_under gate: coverage is reported (term-missing) but not enforced, so a
# template user adding lightly-tested code does not hit surprise CI failures.
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = 'py314'
line-length = 88
indent-width = 2

include = [
  "pyproject.toml",
  "*.py",
  "*.pyi",
]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "stubs",
]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N", "UP"]
ignore = [
  "E741",  # prefer notation consistency over legibility in all fonts
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = [
  "jax",
  "equinox",
  "jaxtyping",
  "optax",
  "optimistix",
]
known-first-party = [
  "marimo_uv_jax",
  "tests",
]

[tool.ruff.lint.per-file-ignores]
# https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
# jaxtyping puts dimension strings like Float[Array, "batch in_size"] inside
# annotations, which ruff reads as a forward-reference syntax error (F722).
# Scope the ignore to the jaxtyping-using package so real malformed annotations
# elsewhere are still caught.
"src/marimo_uv_jax/*.py" = ["F722"]
# marimo passes imported names (incl. PascalCase classes) and module-level
# constants into cell functions as arguments, which trips N803/N806.
"notebooks/**/*.py" = ["N803", "N806"]

[tool.marimo.ai]
rules = "- prefer polars over pandas\n- make charts using altair"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.package_management]
manager = "uv"

[tool.marimo.runtime]
pythonpath = ["./src"]
on_startup = "import marimo as mo"
