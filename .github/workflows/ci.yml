name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is Intel x86_64 (the JAX 0.4.x path).
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Run every step under bash (Git Bash on Windows) so the notebook-validation
    # loop is portable across all runners.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Lint
        run: uv run prek run --all-files

      - name: Type check
        run: uv run --all-groups ty check

      - name: Validate notebooks
        # Export to a real relative path (not /dev/null, which native-Windows
        # Python does not treat as the null device) and discard it.
        run: |
          while read -r nb; do
            echo "::group::$nb"
            uv run marimo export html "$nb" -o _validate.html
            echo "::endgroup::"
          done < <(find notebooks -name '*.py' ! -name '__init__.py')
          rm -f _validate.html

      - name: Run tests (with coverage)
        run: uv run pytest --cov=marimo_uv_jax --cov-report=term-missing -n=auto
